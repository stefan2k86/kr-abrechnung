<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>KR-Abrechnung – Selbsttest</title>
<style>
 body{font:15px/1.5 system-ui,sans-serif;margin:2rem;max-width:820px}
 .ok{color:#1f7a4d}.fail{color:#b3261e;font-weight:700}
 pre{background:#f4f6f8;padding:.4rem .6rem;border-radius:6px;white-space:pre-wrap}
 h2{margin-top:1.6rem}
</style></head>
<body>
<h1>Selbsttest</h1>
<p>Prüft Rechenkern und CSV-Parser gegen die Beispieldateien. Alle Zeilen sollten grün sein.</p>
<div id="out"></div>

<script type="module">
import { betragJeAbschnitt, defaultSaetze, kuerzelFor } from './js/rates.js';
import { parseMeldelisteText, splitName } from './js/import-csv.js';
import { personBetrag, personTage, dauerMin, istAbzurechnen, personAufstellung } from './js/calc.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;
function ok(name, cond, got) {
  const line = document.createElement('div');
  line.className = cond ? 'ok' : 'fail';
  line.textContent = (cond ? '✓ ' : '✗ ') + name + (cond ? '' : `  (erhalten: ${JSON.stringify(got)})`);
  out.appendChild(line);
  cond ? pass++ : fail++;
}
function group(t){ const h=document.createElement('h2'); h.textContent=t; out.appendChild(h); }

// ---- betragJeAbschnitt: Grenzfälle ----
group('betragJeAbschnitt (Grundsatz 12 / Maximalsatz 15)');
const kr = { grund: 12, max: 15 };
ok('d=120 → 12 (Grundsatz)',      betragJeAbschnitt(120, kr) === 12, betragJeAbschnitt(120, kr));
ok('d=121 → 15 (Maximalsatz)',    betragJeAbschnitt(121, kr) === 15, betragJeAbschnitt(121, kr));
ok('d=180 → 15 (Maximalsatz)',    betragJeAbschnitt(180, kr) === 15, betragJeAbschnitt(180, kr));
ok('d=181 → 24 (2× Grundsatz)',   betragJeAbschnitt(181, kr) === 24, betragJeAbschnitt(181, kr));
ok('d=260 → 24 (2× Grundsatz)',   betragJeAbschnitt(260, kr) === 24, betragJeAbschnitt(260, kr));
ok('d=261 → 36 (3× Grundsatz)',   betragJeAbschnitt(261, kr) === 36, betragJeAbschnitt(261, kr));
const sr = { grund: 15, max: 18 };
ok('Schiedsrichter d=200 → 30',   betragJeAbschnitt(200, sr) === 30, betragJeAbschnitt(200, sr));

// ---- Läufer: kein doppelter Grundsatz ----
group('Läufer (Stufe 2: 8 / 9), keinDoppelsatz');
const l2 = { grund: 8, max: 9 };
const kd = { keinDoppelsatz: true };
ok('d=119 → 8 (Grundsatz)',        betragJeAbschnitt(119, l2, kd) === 8, betragJeAbschnitt(119, l2, kd));
ok('d=120 → 8 (Grundsatz)',        betragJeAbschnitt(120, l2, kd) === 8, betragJeAbschnitt(120, l2, kd));
ok('d=121 → 9 (Maximalsatz)',      betragJeAbschnitt(121, l2, kd) === 9, betragJeAbschnitt(121, l2, kd));
ok('d=200 → 9 (kein 2×)',          betragJeAbschnitt(200, l2, kd) === 9, betragJeAbschnitt(200, l2, kd));
ok('d=300 → 9 (kein 3×)',          betragJeAbschnitt(300, l2, kd) === 9, betragJeAbschnitt(300, l2, kd));

// Stefans Beispiel: Läufer Stufe 1, 3 Abschnitte à 119 min → 3 × 6 = 18 €
group('Rechenbeispiel: Läufer Stufe 1, 3 × 119 min → 18 €');
const lp = {
  abschnitte: [
    { id: 'x1', nr: 1, datum: '2026-05-01', beginn: '09:00', ende: '10:59' },
    { id: 'x2', nr: 2, datum: '2026-05-01', beginn: '12:00', ende: '13:59' },
    { id: 'x3', nr: 3, datum: '2026-05-02', beginn: '09:00', ende: '10:59' },
  ],
  saetze: defaultSaetze(),
  personen: [],
};
const laeuferP = { einsaetze: [
  { abschnittId: 'x1', rolleKey: 'laeufer_1', imEinsatz: true },
  { abschnittId: 'x2', rolleKey: 'laeufer_1', imEinsatz: true },
  { abschnittId: 'x3', rolleKey: 'laeufer_1', imEinsatz: true },
] };
ok('Abschnitt x1 Dauer = 119',  dauerMin(lp.abschnitte[0]) === 119, dauerMin(lp.abschnitte[0]));
ok('Läufer Stufe 1: 3 × 119 min = 18 €', personBetrag(laeuferP, lp) === 18, personBetrag(laeuferP, lp));
// gemischt: Läufer Stufe 3 (10 / 11), ein kurzer (119) + ein langer (200) Abschnitt → 10 + 11 = 21 €
const lpMix = { saetze: defaultSaetze(), personen: [], abschnitte: [
  { id: 'm1', nr: 1, beginn: '09:00', ende: '10:59' },  // 119 → 10
  { id: 'm2', nr: 2, beginn: '09:00', ende: '12:20' },  // 200 → 11
] };
ok('Läufer Stufe 3 gemischt = 21 €', personBetrag({ einsaetze: [
  { abschnittId: 'm1', rolleKey: 'laeufer_3', imEinsatz: true },
  { abschnittId: 'm2', rolleKey: 'laeufer_3', imEinsatz: true },
] }, lpMix) === 21, personBetrag({ einsaetze: [
  { abschnittId: 'm1', rolleKey: 'laeufer_3', imEinsatz: true },
  { abschnittId: 'm2', rolleKey: 'laeufer_3', imEinsatz: true },
] }, lpMix));

// ---- Pauschale: fester Betrag unabhängig von Dauer ----
group('Pauschale-Rollen (Imbissleiter/Imbisshelfer)');
const ilSatz = { pauschale: 20 };
const ihSatz = { pauschale: 15 };
ok('Imbissleiter d=30 → 20 €', betragJeAbschnitt(30, ilSatz) === 20, betragJeAbschnitt(30, ilSatz));
ok('Imbissleiter d=120 → 20 €', betragJeAbschnitt(120, ilSatz) === 20, betragJeAbschnitt(120, ilSatz));
ok('Imbissleiter d=300 → 20 € (nicht 3×20)', betragJeAbschnitt(300, ilSatz) === 20, betragJeAbschnitt(300, ilSatz));
ok('Imbisshelfer d=45 → 15 €', betragJeAbschnitt(45, ihSatz) === 15, betragJeAbschnitt(45, ihSatz));
ok('Imbisshelfer d=250 → 15 €', betragJeAbschnitt(250, ihSatz) === 15, betragJeAbschnitt(250, ihSatz));
// Pauschale in personBetrag-Kontext: 2 Abschnitte
const pauschaleProj = {
  saetze: defaultSaetze(),
  sachbearbeiterPersonId: null,
  personen: [],
  abschnitte: [
    { id: 'p1', nr: 1, beginn: '09:00', ende: '09:30' },  // 30 min
    { id: 'p2', nr: 2, beginn: '10:00', ende: '13:20' },  // 200 min
  ],
};
ok('Imbissleiter 2 Abschnitte (30+200min) = 40 € (2×20)', personBetrag({ einsaetze: [
  { abschnittId: 'p1', rolleKey: 'imbissleiter', imEinsatz: true },
  { abschnittId: 'p2', rolleKey: 'imbissleiter', imEinsatz: true },
] }, pauschaleProj) === 40, personBetrag({ einsaetze: [
  { abschnittId: 'p1', rolleKey: 'imbissleiter', imEinsatz: true },
  { abschnittId: 'p2', rolleKey: 'imbissleiter', imEinsatz: true },
] }, pauschaleProj));

// ---- Sachbearbeiter Meldeverfahren: +12 € je Abschnitt, zusätzlich zur Rolle ----
group('Sachbearbeiter Meldeverfahren (+12 €/Abschnitt, zusätzlich)');
const sbProj = {
  saetze: defaultSaetze(),
  sachbearbeiterPersonId: 'pB',
  abschnitte: [
    { id: 'q1', nr: 1, beginn: '09:00', ende: '11:00' },   // 120 → Grundsatz
    { id: 'q2', nr: 2, beginn: '09:00', ende: '13:00' },    // 240 → 2×Grundsatz (KR)
  ],
  personen: [
    { id: 'pA', einsaetze: [ { abschnittId: 'q1', rolleKey: 'schwimmrichter', imEinsatz: true } ] },
    { id: 'pB', einsaetze: [ { abschnittId: 'q1', rolleKey: 'zeitnehmer', imEinsatz: true } ] },
  ],
};
ok('Satz Sachbearbeiter = 12 €/Abschnitt', sbProj.saetze.sachbearbeiterProAbschnitt === 12, sbProj.saetze.sachbearbeiterProAbschnitt);
// pA (kein Sachbearbeiter): nur Schwimmrichter q1 120min → 12 €
ok('Person A ohne Sachbearbeiter = 12 €', personBetrag(sbProj.personen[0], sbProj) === 12, personBetrag(sbProj.personen[0], sbProj));
// pB: Zeitnehmer q1 120min (12 €) + Sachbearbeiter-Bonus 2 Abschnitte × 12 = 24 → 36 €
ok('Person B mit Sachbearbeiter = 36 € (12 + 2×12)', personBetrag(sbProj.personen[1], sbProj) === 36, personBetrag(sbProj.personen[1], sbProj));
// Sachbearbeiter ohne eigene Einsätze steht trotzdem auf der Liste
const sbOnly = { saetze: defaultSaetze(), sachbearbeiterPersonId: 'x', abschnitte: [{id:'a',nr:1,beginn:'09:00',ende:'11:00'},{id:'b',nr:2,beginn:'09:00',ende:'11:00'}], personen: [{ id:'x', einsaetze: [] }] };
ok('Sachbearbeiter ohne Einsätze: abzurechnen', istAbzurechnen(sbOnly.personen[0], sbOnly) === true, null);
ok('Sachbearbeiter ohne Einsätze: 24 €', personBetrag(sbOnly.personen[0], sbOnly) === 24, personBetrag(sbOnly.personen[0], sbOnly));

// ---- Kürzel für die Auszahlungsliste ----
group('Kürzel je Rolle');
ok('Schiedsrichter → SCH', kuerzelFor('schiedsrichter') === 'SCH', kuerzelFor('schiedsrichter'));
ok('Schwimmrichter → SR', kuerzelFor('schwimmrichter') === 'SR', kuerzelFor('schwimmrichter'));
ok('Starter → ST', kuerzelFor('starter') === 'ST', kuerzelFor('starter'));
ok('Läufer Stufe 2 → L2', kuerzelFor('laeufer_2') === 'L2', kuerzelFor('laeufer_2'));
ok('Sachbearbeiter → SB', kuerzelFor('sachbearbeiter') === 'SB', kuerzelFor('sachbearbeiter'));
// Aufstellung liefert Kürzel je Zeile
const aufP = personAufstellung({ id: 'z', einsaetze: [
  { abschnittId: 'q1', rolleKey: 'zeitnehmer', imEinsatz: true },
] }, { saetze: defaultSaetze(), sachbearbeiterPersonId: null, abschnitte: [
  { id: 'q1', nr: 1, beginn: '09:00', ende: '11:00' },
], personen: [] });
ok('Aufstellung: Kürzel = ZN', aufP[0].kuerzel === 'ZN', aufP[0]);

// ---- Stefans Rechenbeispiel: 200 min + 178 min für einen Kampfrichter → 39 € ----
group("Rechenbeispiel: Kampfrichter, Abschnitt 200 min + 178 min");
const project = {
  abschnitte: [
    { id: 'a1', nr: 1, datum: '2026-04-25', beginn: '09:00', ende: '12:20' }, // 200 min
    { id: 'a2', nr: 2, datum: '2026-04-26', beginn: '09:00', ende: '11:58' }, // 178 min
  ],
  saetze: defaultSaetze(),
  personen: [],
};
ok('Abschnitt 1 Dauer = 200',  dauerMin(project.abschnitte[0]) === 200, dauerMin(project.abschnitte[0]));
ok('Abschnitt 2 Dauer = 178',  dauerMin(project.abschnitte[1]) === 178, dauerMin(project.abschnitte[1]));
const person = { einsaetze: [
  { abschnittId: 'a1', rolleKey: 'schwimmrichter', imEinsatz: true },
  { abschnittId: 'a2', rolleKey: 'schwimmrichter', imEinsatz: true },
] };
ok('Betrag = 39 € (2×12 + 15)',  personBetrag(person, project) === 39, personBetrag(person, project));
ok('Tage = 2',  personTage(person, project) === 2, personTage(person, project));

// ---- splitName ----
group('Namens-Zerlegung');
ok('"Böhmert, Jan (P-SCH)"', JSON.stringify(splitName('Böhmert, Jan (P-SCH)')) === JSON.stringify({ nachname: 'Böhmert', vorname: 'Jan', zusatz: 'P-SCH' }), splitName('Böhmert, Jan (P-SCH)'));
ok('"Wilisch-Brosche, Franziska"', splitName('Wilisch-Brosche, Franziska').nachname === 'Wilisch-Brosche', splitName('Wilisch-Brosche, Franziska'));

// ---- CSV-Parser gegen die Beispieldatei ----
group('CSV-Parser: beispiel/meldungen.csv');
try {
  const buf = await fetch('./beispiel/meldungen.csv').then(r => r.arrayBuffer());
  const text = new TextDecoder('windows-1252').decode(buf);
  const parsed = parseMeldelisteText(text);
  ok('3 Abschnitte erkannt', parsed.abschnitte.length === 3, parsed.abschnitte.map(a => a.nr));
  ok('35 verschiedene Personen', parsed.personen.length === 35, parsed.personen.length);
  const zocher = parsed.personen.find(p => p.nachname === 'Zocher');
  const christ = parsed.personen.find(p => p.nachname === 'Christmann');
  ok('Zocher, Ulrike = Abgemeldet', zocher && zocher.status === 'Abgemeldet', zocher);
  ok('Christmann, Andrea = Abgemeldet', christ && christ.status === 'Abgemeldet', christ);
  const bestaetigt = parsed.personen.filter(p => p.status === 'Bestätigt');
  ok('33 bestätigte Personen', bestaetigt.length === 33, bestaetigt.length);
  ok('2 abgemeldete Personen', parsed.personen.filter(p => p.status === 'Abgemeldet').length === 2, null);
  const dreiAbschnitte = bestaetigt.filter(p => p.abschnittNummern.length === 3).length;
  ok('21 bestätigte in allen 3 Abschnitten', dreiAbschnitte === 21, dreiAbschnitte);
  const nurA1 = bestaetigt.filter(p => p.abschnittNummern.join() === '1').length;
  ok('6 bestätigte nur in Abschnitt 1', nurA1 === 6, nurA1);
  const nurA23 = bestaetigt.filter(p => p.abschnittNummern.join() === '2,3').length;
  ok('6 bestätigte nur in Abschnitt 2+3', nurA23 === 6, nurA23);
  const veranstaltung = parsed.veranstaltung;
  ok('Veranstaltungsname erkannt', /BZM/.test(veranstaltung.name || ''), veranstaltung);
  ok('Datum von = 2026-04-25', veranstaltung.datumVon === '2026-04-25', veranstaltung.datumVon);
} catch (e) {
  ok('CSV-Beispiel geladen', false, String(e));
}

const sum = document.createElement('h2');
sum.textContent = `Ergebnis: ${pass} ok, ${fail} fehlgeschlagen`;
sum.style.color = fail ? '#b3261e' : '#1f7a4d';
out.prepend(sum);
</script>
</body>
</html>
